server:
  port: 8083

spring:
  application:
    name: payment-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

blackbox:
  dev-mode:
    enabled: true
  tracing:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
