server:
  port: 8081

spring:
  application:
    name: api-gateway

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

services:
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8082}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

blackbox:
  dev-mode:
    enabled: true
  tracing:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
